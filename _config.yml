# Site
title: 昂予
subtitle: 想的都是问题，做的全是答案
description: 记录技术实践、项目复盘与生活片段。
keywords: 技术博客, Cocos Creator, JavaScript, 游戏开发, 个人成长
author: 昂予
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://angyuer.com
permalink: posts/:abbrlink.html
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false

stylus:
  compress: true

# Home
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & tag
default_category: 技术
category_map:
tag_map:

# Date and pagination
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page

# Theme
theme: butterfly

# Deployment
deploy:
  type: git
  repo: git@github.com:angyuer/angyuer.github.io.git
  branch: main

# Stable short URLs
abbrlink:
  alg: crc32
  rep: hex
  drafts: false
  auto_category:
    enable: false
  auto_title: false
  auto_date: false
  force: false

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  autodiscovery: true

# Search and sitemap generators use their defaults.
