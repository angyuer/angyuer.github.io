# Navigation
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  技术: /tech/
  日记: /journal/
  项目: /projects/

# Code blocks
code_blocks:
  theme: light
  macStyle: true
  height_limit: 720
  word_wrap: true
  copy: true
  language: true
  shrink: false
  fullpage: false

social:
  fab fa-github: https://github.com/angyuer || GitHub || '#24292f'
  fas fa-envelope: mailto:angyuer@163.com || Email || '#e96b55'
  fas fa-rss: /atom.xml || RSS || '#f59e0b'

# Images
favicon: https://angyublog.oss-cn-hangzhou.aliyuncs.com/common/avatar.JPG
avatar:
  img: https://angyublog.oss-cn-hangzhou.aliyuncs.com/common/avatar.JPG
  effect: false
disable_top_img: false
default_top_img: /images/hero/hero-desktop.webp
index_img: /images/hero/hero-desktop.webp
archive_img: /images/hero/hero-desktop.webp
tag_img: /images/hero/hero-desktop.webp
category_img: /images/hero/hero-desktop.webp
footer_img: false
background: '#f2f2f0'
cover:
  index_enable: true
  aside_enable: false
  archives_enable: true
  default_cover: /images/hero/hero-desktop.webp
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg
error_404:
  enable: true
  subtitle: 页面暂时没有找到
  background: /img/error-page.png

# Post list and metadata
post_meta:
  page:
    date_type: updated
    date_format: date
    categories: true
    tags: true
    label: false
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true
index_site_info_top:
index_top_img_height: 100vh
subtitle:
  enable: true
  effect: false
  source: false
  sub:
    - 记录技术实践、项目复盘与生活片段
index_layout: 4
index_post_content:
  method: 2
  length: 180

# Article experience
toc:
  post: true
  page: false
  number: false
  expand: false
  style_simple: true
  scroll_percent: true
post_copyright:
  enable: true
  decode: false
  author_href: https://angyuer.com
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
reward:
  enable: false
related_post:
  enable: true
  limit: 4
  date_type: updated
post_pagination: 1
noticeOutdate:
  enable: true
  style: flat
  limit_day: 540
  position: top
  message_prev: 本文最后更新于
  message_next: 天前，部分内容可能已经变化。

# Footer
footer:
  owner:
    enable: true
    since: 2020
  copyright:
    enable: false
    version: false

# Aside: only the article TOC remains visually prominent.
aside:
  enable: true
  hide: false
  button: false
  mobile: false
  position: right
  display:
    archive: false
    tag: false
    category: false
  card_author:
    enable: false
  card_announcement:
    enable: false
  card_recent_post:
    enable: false
  card_newest_comments:
    enable: false
  card_categories:
    enable: false
  card_tags:
    enable: false
  card_archives:
    enable: false
  card_post_series:
    enable: false
  card_webinfo:
    enable: false

# Reading controls
translate:
  enable: false
readmode: false
darkmode:
  enable: true
  button: true
  autoChangeMode: 1
rightside_scroll_percent: true
rightside_config_animation: false
rightside_item_order:
  enable: true
  hide:
  show: darkmode,toc,comment
copy:
  enable: true
  copyright:
    enable: true
    limit_count: 120
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: false
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# Search, share, comments
search:
  use: local_search
  placeholder: 搜索文章、标签或项目
  local_search:
    preload: false
    top_n_per_article: 2
    unescape: false
    pagination:
      enable: true
      hitsPerPage: 8
share:
  use: sharejs
  sharejs:
    sites: wechat,weibo,qq
comments:
  use: Twikoo
  text: true
  lazyload: true
  count: false
  card_post_count: false
twikoo:
  envId: https://twikoo.angyuer.com/
  region:
  visitor: true
  option:

# Visual system
theme_color:
  enable: true
  main: '#656565'
  paginator: '#656565'
  button_hover: '#444444'
  text_selection: '#d8d8d6'
  link_color: '#4f4f4d'
  meta_color: '#737371'
  hr_color: '#d2d2cf'
  code_foreground: '#5f5f5d'
  code_background: 'rgba(30, 30, 30, .055)'
  toc_color: '#656565'
  blockquote_padding_color: '#656565'
  blockquote_background_color: 'rgba(101, 101, 101, .09)'
  scrollbar_color: '#656565'
  meta_theme_color_light: '#f2f2f0'
  meta_theme_color_dark: '#0e0f0f'
rounded_corners_ui: true
text_align_justify: false
mask:
  header: true
  footer: false
preloader:
  enable: false
enter_transitions: false
display_mode: light
beautify:
  enable: false
font:
  global_font_size: 16px
  code_font_size: 14px
  font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
  code_font_family: "'SFMono-Regular', Consolas, 'Liberation Mono', monospace"
activate_power_mode:
  enable: false
canvas_ribbon:
  enable: false
canvas_fluttering_ribbon:
  enable: false
canvas_nest:
  enable: false
fireworks:
  enable: false
click_heart:
  enable: false
clickShowText:
  enable: false
lightbox:
mermaid:
  enable: true
  code_write: true
  theme:
    light: neutral
    dark: dark
  open_in_new_tab: true
  zoom_pan: true
pjax:
  enable: false
snackbar:
  enable: false
  position: bottom-left
  bg_light: '#656565'
  bg_dark: '#242525'
instantpage: false
lazyload:
  enable: true
  native: true
  field: site
Open_Graph_meta:
  enable: true
structured_data:
  enable: true
css_prefix: true
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script defer src="/js/site.js"></script>
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
  option:
    fontawesome: /vendor/fontawesome/css/all.min.css
